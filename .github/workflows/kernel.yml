# Phase 4 feasibility (README): build the CachyOS kernel from its public source (CachyOS/linux-cachyos, GPL-2.0)
# on a GitHub runner, to see whether it fits the runner (6 h limit, disk, memory) and which CachyOS optimisations
# survive a self-build. Nothing is published: the packages stay a run artifact for 3 days. Manual start only.
name: kernel

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'CachyOS/linux-cachyos commit (reviewed and pinned)'
        default: 'b3022c68bb51faccf596572195e8a21d34fdf5b5'
      lto:
        description: 'none = GCC build; thin = clang ThinLTO (CachyOS default, needs more memory and time)'
        default: 'none'
      cpu:
        description: 'generic_v1 (all 64-bit PCs, like Arch) up to generic_v4; never native for a shared package'
        default: 'generic_v1'

permissions:
  contents: read

concurrency:
  group: kernel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Make room on the runner
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null
          df -h /

      - uses: actions/checkout@v6

      - name: Build the kernel
        run: |
          docker run --rm -v "${PWD}:/work" -e CI=true archlinux:base-devel \
            bash /work/tools/build-kernel.sh "${{ inputs.commit }}" "${{ inputs.lto }}" "${{ inputs.cpu }}" /work/out

      - name: Report
        if: always()
        run: |
          { echo '```'; cat out/report.txt 2>/dev/null || echo 'no report'; echo '```'; } >> "${GITHUB_STEP_SUMMARY}"

      - name: Keep the kernel package and the report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: kernel-${{ inputs.lto }}-${{ inputs.cpu }}
          path: |
            out/keep/*.pkg.tar.zst
            out/report.txt
          retention-days: 3
          if-no-files-found: warn

      - name: Keep the build log if it failed
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: kernel-log-${{ inputs.lto }}-${{ inputs.cpu }}
          path: out/makepkg.log
          retention-days: 3
