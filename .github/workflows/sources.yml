# Archives the source code of every copyleft package (GPL, LGPL, AGPL, MPL, EPL, CDDL, EUPL) in a FloppaOS
# release into the GitHub release sources-<version>, for the source code offer (docs/source-code.md).
#
# Called by iso.yml after a release build, or started by hand (Actions -> sources -> Run workflow) to redo it.
# The release sources-<version> must already hold sources.tsv (iso.yml puts it there). Eight runners share the
# work; each package is uploaded right after it is made, so a runner's disk never holds more than one. Running it
# again replaces the files (--clobber). Takes about an hour; free, because this repository is public.
# "only" redoes just the named source packages (for example the ones in FAILED.txt) and merges them into the
# existing SOURCES-INDEX.tsv.
name: sources

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release version, e.g. 0.1.0-preview (its release sources-<version> must hold sources.tsv)'
        required: true
      only:
        description: 'Optional: only these source packages, separated by spaces (e.g. the ones in FAILED.txt)'
        required: false
        default: ''
  workflow_call:
    inputs:
      release:
        type: string
        required: true
      only:
        type: string
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: sources-${{ inputs.release }}
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    container:
      image: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      REL: ${{ inputs.release }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git github-cli mercurial subversion   # the last two: the few sources kept in hg or svn
      - uses: actions/checkout@v6
      - name: Package list
        run: |
          set -euo pipefail
          [[ ${REL} =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.]+)?$ ]] || { echo "Bad release version: ${REL}"; exit 1; }
          gh release download "sources-${REL}" --repo "${GITHUB_REPOSITORY}" --pattern sources.tsv --dir /tmp/list --clobber
          echo "$(grep -vc '^#' /tmp/list/sources.tsv) source packages in the image"
      - name: Archive and upload the sources (shard ${{ matrix.shard }} of 8)
        env:
          SHARD: ${{ matrix.shard }}
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          UPLOAD_TO="sources-${REL}" bash tools/archive-sources.sh /tmp/list/sources.tsv /tmp/out "${SHARD}" 8
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: sources-index-${{ matrix.shard }}
          path: |
            /tmp/out/index-*.tsv
            /tmp/out/failed-*.txt
          retention-days: 7

  index:
    needs: archive
    if: always()
    runs-on: ubuntu-latest
    env:
      REL: ${{ inputs.release }}
      ONLY: ${{ inputs.only }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: sources-index-*
          path: parts
          merge-multiple: true
      - name: Index and failures
        run: |
          set -euo pipefail
          [[ ${REL} =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.]+)?$ ]] || { echo "Bad release version: ${REL}"; exit 1; }
          cat parts/index-*.tsv > new-index.tsv
          cat parts/failed-*.txt > FAILED.txt || true
          if [ -n "${ONLY}" ]; then
            # Redo of some packages: keep everything else from the existing index and failure list
            gh release download "sources-${REL}" --repo "${GITHUB_REPOSITORY}" --pattern SOURCES-INDEX.tsv --dir old --clobber || true
            gh release download "sources-${REL}" --repo "${GITHUB_REPOSITORY}" --pattern FAILED.txt --dir old --clobber || true
            touch old/SOURCES-INDEX.tsv old/FAILED.txt
            cut -f3 new-index.tsv > new-files.txt
            grep -v '^#' old/SOURCES-INDEX.tsv | awk -F'\t' 'NR==FNR{n[$1]=1; next} !($3 in n)' new-files.txt - >> new-index.tsv
            awk -v only=" ${ONLY} " '{ if (index(only, " " $1 " ") == 0) print }' old/FAILED.txt >> FAILED.txt
          fi
          { printf '# source package\tversion\tfile\tbytes\tsha256\n'; sort -u new-index.tsv; } > SOURCES-INDEX.tsv
          sort -u -o FAILED.txt FAILED.txt
          gh release upload "sources-${REL}" SOURCES-INDEX.tsv --repo "${GITHUB_REPOSITORY}" --clobber
          {
            echo "## Sources for FloppaOS ${REL}"
            echo
            echo "- Archived: $(($(wc -l < SOURCES-INDEX.tsv) - 1)) files, $(awk -F'\t' 'NR>1{s+=$4} END{printf "%.1f GB", s/1e9}' SOURCES-INDEX.tsv)"
            echo "- Failed: $(wc -l < FAILED.txt)"
            if [ -s FAILED.txt ]; then echo; echo '```'; cat FAILED.txt; echo '```'; fi
          } >> "${GITHUB_STEP_SUMMARY}"
          if [ -s FAILED.txt ]; then
            gh release upload "sources-${REL}" FAILED.txt --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release delete-asset "sources-${REL}" FAILED.txt --repo "${GITHUB_REPOSITORY}" --yes 2>/dev/null || true
          fi
