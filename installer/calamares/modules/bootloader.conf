# FloppaOS installer: GRUB for both UEFI and old BIOS computers.
---
efiBootLoader: "grub"
kernelSearchPath: "/usr/lib/modules"
kernelPattern: "^vmlinuz.*"
loaderEntries:
    - "timeout 5"
    - "console-mode keep"
kernelParams: [ "quiet" ]
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
efiBootloaderId: "FloppaOS"
# Also put GRUB at the UEFI fallback path (\EFI\BOOT\BOOTX64.EFI): some computers and VMs forget boot entries.
installEFIFallback: true
installHybridGRUB: false
