# FloppaOS installer: the login screen (Plasma Login Manager, decision 19). Automatic login, if the user
# ticked it, goes to /etc/plasmalogin.conf and starts Plasma on Wayland (Calamares' own detection only knows
# the X11 starter, which Plasma 6.8 no longer ships).
---
displaymanagers:
    - plasmalogin
defaultDesktopEnvironment:
    executable: "/usr/bin/startplasma-wayland"
    desktopFile: "plasma"
basicSetup: false
sysconfigSetup: false
