# FloppaOS installer: /etc/default/grub. Boot menu says "FloppaOS" (branding) and lists Windows too.
---
overwrite: false
prefer_grub_d: false
keep_distributor: false
kernel_params: [ "quiet", "loglevel=3" ]
defaults:
    GRUB_TIMEOUT: 5
    GRUB_DEFAULT: "0"
    GRUB_DISABLE_SUBMENU: false
    GRUB_TERMINAL_OUTPUT: "console"
    GRUB_DISABLE_RECOVERY: true
    # Find other systems (Windows) for the boot menu.
    GRUB_DISABLE_OS_PROBER: false
    # GRUB 2.16 would also list every firmware boot entry (DVD drive, network boot, FloppaOS itself) as
    # "(EFI BootNext)"; Windows is still found by os-prober (research §20).
    GRUB_DISABLE_BOOTNEXT: true
# The copied system already has Arch's /etc/default/grub; apply the defaults above to it anyway.
always_use_defaults: true
