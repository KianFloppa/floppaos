# FloppaOS installer: keyboard layout. On the Wayland live desktop Calamares sets the layout through
# systemd-localed; installer/live-keyboard.sh applies it to the live Plasma session, so the password
# is typed with the layout the user picked (important for layouts like German with y/z swapped).
---
xOrgConfFileName:           "/etc/X11/xorg.conf.d/00-keyboard.conf"
convertedKeymapPath:        "/lib/kbd/keymaps/xkb"
configure:
    kwin: false
