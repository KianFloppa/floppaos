# FloppaOS installer: language and time zone. The time zone is guessed from the internet connection
# (KDE's GeoIP service, the Calamares default); without internet it starts at Europe/Berlin.
---
region:                     "Europe"
zone:                       "Berlin"
localeGenPath:              "/etc/locale.gen"
geoip:
    style:    "json"
    url:      "https://geoip.kde.org/v1/calamares"
    selector: ""
