# FloppaOS installer page "Before you start" (installed as /etc/calamares/modules/notesqml-beforeyoustart.conf).
# Calamares' notesqml module shows a QML file as a page: branding/floppaos/before-you-start.qml, the
# no-warranty notice and "back up your files first". Shown right after the welcome page.
---
qmlSearch: branding
qmlFilename: before-you-start

qmlLabel:
    notes: "Before you start"
