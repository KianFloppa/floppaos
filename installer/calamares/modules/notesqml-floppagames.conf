# FloppaOS installer page "Floppa games" (installed as /etc/calamares/modules/notesqml-floppagames.conf).
# Calamares' notesqml module shows a QML file as a page. Ours has tick boxes for what Floppa Setup does at
# the first login: branding/floppaos/floppa-games.qml. The floppasetup step saves the choices.
---
qmlSearch: branding
qmlFilename: floppa-games

qmlLabel:
    notes: "Floppa games"
