# FloppaOS installer page "Secure Boot" (installed as /etc/calamares/modules/notesqml-secureboot.conf).
# Calamares' notesqml module shows a QML file as a page: branding/floppaos/secure-boot.qml, one tick box
# and the one-time code for the key confirmation at the next start. The floppasecureboot step does the work.
---
qmlSearch: branding
qmlFilename: secure-boot

qmlLabel:
    notes: "Secure Boot"
