# FloppaOS installer: disks. Offers "erase disk", "install alongside" (e.g. next to Windows: shrinks it)
# and manual partitioning. Nothing is chosen in advance, so the user decides what happens to the disk.
---
efi:
    mountPoint:         "/boot/efi"
    recommendedSize:    512MiB
    minimumSize:        32MiB
    label:              "EFI"

userSwapChoices:
    - none      # no swap
    - small     # up to 4 GB
    - file      # swap file instead of a partition

# GRUB reads LUKS1 reliably; LUKS2 needs a patched GRUB.
luksGeneration: luks1

drawNestedPartitions:       false
alwaysShowPartitionLabels:  true
allowManualPartitioning:    true
initialPartitioningChoice:  none
initialSwapChoice:          none

defaultFileSystemType:      "ext4"
availableFileSystemTypes:   ["ext4", "btrfs", "xfs"]

essentialMounts: [ "live-*", "control", "ventoy" ]

lvm:
    enable: true
