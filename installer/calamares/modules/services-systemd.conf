# FloppaOS installer: services of the installed system. Most are already on in the copied live system;
# the live-only ones are removed by installer/target-cleanup.sh. None of these may stop the install.
---
units:
    - name: "NetworkManager.service"
      action: "enable"
      mandatory: false
    - name: "plasmalogin.service"
      action: "enable"
      mandatory: false
    - name: "systemd-timesyncd.service"
      action: "enable"
      mandatory: false
    - name: "fstrim.timer"
      action: "enable"
      mandatory: false
    # The live system runs an SSH server; a gaming desktop should not by default.
    - name: "sshd.service"
      action: "disable"
      mandatory: false
