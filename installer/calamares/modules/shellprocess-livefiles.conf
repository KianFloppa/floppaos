# FloppaOS installer, step "livefiles": runs inside the installed system right after the user account
# was created. Turns the copied live system into a normal installed system; see installer/target-cleanup.sh.
---
dontChroot: false
timeout: 900
verbose: true
script:
    - command: "/usr/lib/floppaos-installer/target-cleanup"
      timeout: 900
i18n:
    name: "Preparing FloppaOS for its first start"
