# FloppaOS installer, step "removeinstaller": the installed system does not need the installer.
# Failure is ignored (the leading "-"): an extra package left behind does no harm.
---
dontChroot: false
timeout: 300
script:
    # Windows-like start: no boot menu on screen when FloppaOS is the only system (installer/grub-quiet.sh).
    - "-/usr/lib/floppaos-installer/grub-quiet"
    - "-pacman -Rns --noconfirm floppaos-installer calamares"
i18n:
    name: "Removing the installer from the new system"
