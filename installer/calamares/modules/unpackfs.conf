# FloppaOS installer: copy the live system onto the disk.
# Arch's live boot always keeps the read-only system image mounted at /run/archiso/airootfs, also when it
# copied itself into RAM at boot (then the USB stick is no longer mounted). Copying from there (rsync)
# gives the untouched image, without anything changed during the live session.
---
unpack:
    -   source: "/run/archiso/airootfs"
        sourcefs: "file"
        destination: ""
