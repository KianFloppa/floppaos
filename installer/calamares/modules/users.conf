# FloppaOS installer: the user account. Simple on purpose (like a Windows setup): one password is also
# used for the administrator (root) unless the user unticks that; short passwords are allowed after a warning.
---
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - lp
    - video
    - network
    - storage
    - name: wheel
      must_exist: false
      system: true
    - audio
    - input
    # GameMode may change the CPU governor for members of this group without asking (Arch Wiki, GameMode).
    - name: gamemode
      must_exist: false
      system: true

sudoersGroup:               wheel
# Calamares adds an automatic-login user to this group (created if missing); Plasma Login Manager does not need it.
autologinGroup:             autologin
sudoersConfigureWithGroup:  false

setRootPassword:            true
doReusePassword:            true

displayAutologin:           true
doAutologin:                false

passwordRequirements:
    minLength: 1
    maxLength: -1
allowWeakPasswords:         true
allowWeakPasswordsDefault:  true

user:
    shell: /bin/bash
    # floppa is the live user that the installer removes again.
    forbidden_names: [ root, floppa ]
    home_permissions: "o700"

hostname:
    location: EtcFile
    writeHostsFile: true
    template: "${first}-floppaos"
    forbidden_names: [ localhost, archiso, floppaos-live ]
