# FloppaOS installer: first page. Checks the computer is big enough before anything else happens.
---
showSupportUrl:         true
showKnownIssuesUrl:     true
showReleaseNotesUrl:    false
showDonateUrl:          false

requirements:
    # The installed system takes about 8 GiB; the rest is room for games and updates.
    requiredStorage:    20.0
    requiredRam:        2.0
    # Not checked (the installer needs no internet), kept for completeness.
    internetCheckUrl:   https://archlinux.org
    check:
        - storage
        - ram
        - power
        - root
        - screen
    required:
        - storage
        - ram
        - root
