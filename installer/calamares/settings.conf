# FloppaOS installer: Calamares 3.4 main settings (installed as /etc/calamares/settings.conf).
#
# How FloppaOS is installed (details: installer/README.md):
#   1. The pages ask for language/time zone, keyboard, disk, the user account, on the "Floppa games"
#      page what Floppa Setup should do at the first login (Floppa Launcher, taskbar pin, Wine), and on the
#      "Secure Boot" page whether FloppaOS should start with Secure Boot on.
#   2. The live system (the read-only image the USB stick boots) is copied onto the disk. No internet needed.
#   3. "livefiles" turns that copy into a normal installed system: kernel into /boot, package keyring,
#      no automatic root login, no passwordless sudo (installer/target-cleanup.sh).
#   4. "floppasetup" saves the "Floppa games" choices for Floppa Setup (/etc/floppaos/setup-choices.conf).
#   5. GRUB is installed (finds Windows too). With the Secure Boot box ticked, "floppasecureboot" puts the
#      Microsoft-signed shim in front of it and signs GRUB and the kernel with a key for this PC
#      (secureboot/). Then the installer removes itself from the new system.
---
# local = Calamares' own modules; the second folder holds FloppaOS's own (floppaos-installer).
modules-search: [ local, /usr/lib/floppaos-installer/calamares-modules ]

instances:
  - id: livefiles
    module: shellprocess
    config: shellprocess-livefiles.conf
  - id: removeinstaller
    module: shellprocess
    config: shellprocess-removeinstaller.conf
  - id: beforeyoustart
    module: notesqml
    config: notesqml-beforeyoustart.conf
  - id: floppagames
    module: notesqml
    config: notesqml-floppagames.conf
  - id: secureboot
    module: notesqml
    config: notesqml-secureboot.conf

sequence:
  - show:
      - welcome
      - notesqml@beforeyoustart
      - locale
      - keyboard
      - partition
      - users
      - notesqml@floppagames
      - notesqml@secureboot
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - luksbootkeyfile
      - luksopenswaphookcfg
      - removeuser
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - shellprocess@livefiles
      - floppasetup
      - services-systemd
      - initcpiocfg
      - initcpio
      - grubcfg
      - bootloader
      - floppasecureboot
      - shellprocess@removeinstaller
      - preservefiles
      - umount
  - show:
      - finished

branding: floppaos

# Ask once more before anything is written to the disk.
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: false
