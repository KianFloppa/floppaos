# FloppaOS live system: keyboard layout "us", as systemd-localed reports it. The installer's keyboard page starts
# from the layout localed reports; without this file there was none, and the page fell back to the first entry of
# its list ("A user-defined custom Layout"). The installer writes the layout the user picks over this file.
Section "InputClass"
        Identifier "system-keyboard"
        MatchIsKeyboard "on"
        Option "XkbLayout" "us"
        Option "XkbModel" "pc105"
EndSection
