# FloppaOS live system only (the installer removes this folder). Arch's live keyring setup (pacman-init) waits
# for the clock to be set from the internet. Without internet (Wi-Fi not connected yet) that never happens and
# the end of the boot hung on "Wait Until Kernel Time Synchronized ... no limit". Give up after 30 seconds and
# use the computer's own clock.
[Service]
TimeoutStartSec=30s
